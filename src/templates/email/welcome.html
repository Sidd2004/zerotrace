<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #060606; color: #f8fafc; font-family: 'Inter', Helvetica, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="font-size: 24px; font-weight: bold; color: #f8fafc; letter-spacing: -0.5px;">Zero<span style="color: #ef2f88;">Trace</span></div>
    </div>
    <div style="background-color: #0f0f11; border: 1px solid #1f1f22; border-radius: 12px; padding: 30px; text-align: center;">
      <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, rgba(239, 47, 136, 0.2), rgba(136, 67, 242, 0.2)); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 24px;">👋</span>
      </div>
      <h1 style="color: #f8fafc; font-size: 22px; margin-top: 0; margin-bottom: 15px;">Welcome to the Community</h1>
      <p style="color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 25px;">
        Hi {{name}},<br><br>
        We're thrilled to have you join ZeroTrace. Get ready to collaborate, tackle CTF challenges, and share knowledge with top security professionals.
      </p>
      
      <a href="{{login_url}}" style="display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, #ef2f88, #8843f2); color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 15px; margin-bottom: 10px;">
        Access Dashboard
      </a>
    </div>
    <div style="text-align: center; margin-top: 30px; font-size: 13px; color: #64748b;">
      &copy; {{year}} ZeroTrace Security. All rights reserved.
    </div>
  </div>
</body>
</html>
