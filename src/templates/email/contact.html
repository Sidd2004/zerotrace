<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #060606; color: #f8fafc; font-family: 'Inter', Helvetica, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <div style="font-size: 24px; font-weight: bold; color: #f8fafc; letter-spacing: -0.5px;">Zero<span style="color: #ef2f88;">Trace</span></div>
    </div>
    <div style="background-color: #0f0f11; border: 1px solid #1f1f22; border-radius: 12px; padding: 30px;">
      <h1 style="color: #f8fafc; font-size: 20px; margin-top: 0; margin-bottom: 25px;">New Contact Form Submission</h1>
      
      <div style="margin-bottom: 15px;">
        <span style="color: #64748b; font-size: 15px;">Name:</span>
        <span style="color: #e2e8f0; font-size: 15px; margin-left: 5px;">{{name}}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <span style="color: #64748b; font-size: 15px;">Email:</span>
        <span style="color: #e2e8f0; font-size: 15px; margin-left: 5px;">{{email}}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <span style="color: #64748b; font-size: 15px;">Phone:</span>
        <span style="color: #e2e8f0; font-size: 15px; margin-left: 5px;">{{phone}}</span>
      </div>
      
      <div style="margin-bottom: 15px;">
        <span style="color: #64748b; font-size: 15px;">Service Needed:</span>
        <span style="color: #e2e8f0; font-size: 15px; margin-left: 5px;">{{service}}</span>
      </div>
      
      <div style="margin-bottom: 25px;">
        <div style="color: #64748b; font-size: 15px; margin-bottom: 5px;">Message:</div>
        <div style="color: #e2e8f0; font-size: 15px; line-height: 1.6; background: #1a1a1e; padding: 12px; border-radius: 6px;">{{message}}</div>
      </div>
      
      <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #1f1f22; color: #64748b; font-size: 13px;">
        Submitted At: {{timestamp}}
      </div>
    </div>
    <div style="text-align: center; margin-top: 30px; font-size: 13px; color: #64748b;">
      &copy; {{year}} ZeroTrace Security. All rights reserved.
    </div>
  </div>
</body>
</html>
