<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #060606; color: #f8fafc; font-family: 'Inter', Helvetica, Arial, sans-serif;">
  <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: left; margin-bottom: 30px;">
      <div style="font-size: 24px; font-weight: bold; color: #f8fafc; letter-spacing: -0.5px;">Zero<span style="color: #ef2f88;">Trace</span></div>
    </div>
    <div style="background-color: #0f0f11; border: 1px solid #1f1f22; border-radius: 12px; padding: 30px;">
      <p style="color: #f8fafc; font-size: 16px; margin-top: 0; margin-bottom: 20px;">Hello {{name}},</p>
      
      <p style="color: #94a3b8; font-size: 15px; margin-bottom: 15px; line-height: 1.6;">Thank you for contacting ZeroTrace.</p>
      
      <p style="color: #94a3b8; font-size: 15px; margin-bottom: 15px; line-height: 1.6;">Your message has been successfully received.</p>
      
      <p style="color: #94a3b8; font-size: 15px; margin-bottom: 25px; line-height: 1.6;">Our security team will review your request and respond within 24–48 hours.</p>

      <p style="color: #94a3b8; font-size: 15px; margin-bottom: 5px; line-height: 1.6;">Best regards,</p>
      <p style="color: #f8fafc; font-size: 15px; margin-bottom: 25px; font-weight: bold;">ZeroTrace Security Team</p>
      
      <a href="https://zerotrace.in" style="color: #ef2f88; text-decoration: none; font-size: 14px;">https://zerotrace.in</a>
    </div>
    <div style="text-align: center; margin-top: 30px; font-size: 13px; color: #64748b;">
      &copy; {{year}} ZeroTrace Security. All rights reserved.
    </div>
  </div>
</body>
</html>
